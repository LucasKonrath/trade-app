services:
  db:
    image: postgres:16-alpine
    container_name: trade-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: trade
      POSTGRES_DB: trade
    ports:
      - "5432:5432"
    volumes:
      - trade-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trade-db-data:
